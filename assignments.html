<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Irina Shablinsky">
  <meta name="description" content="Course page description">
  <title>CS1 – Assignments</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <h1>CS1 – Assignments</h1>
  </header>

  <div id="navigation-placeholder"></div>

  <main>
    <section class="programming-assignments">
    <h2>Programming Assignments (20%)</h2>
   <ul>
   <li><a href="assignments/progassignment0.html">Assignment 0 - Getting Started</a></li>
    <li><a href="assignments/progassignment1.html">Assignment 1 - Getting Comfortable with Processing Coordinates</a></li>
     <li><a href="assignments/progassignment2.html">Assignment 2 - Variables, Decisions, and Motion</a></li>
   </ul>
   </section>
   <section class="non-programming-assignments">
    <h2>Non-programming Assignments (15%)</h2>
   <ul>
   <li><a href="assignments/nonprogassignment0.html">Assignment 0 - Exploring the History of Computing</a></li>
   
   </ul>
   </section>
  </main>

  <div id="footer-placeholder"></div>

  <script>
  const siteRoot = window.location.hostname.endsWith("github.io")
    ? `/${window.location.pathname.split("/").filter(Boolean)[0]}/`
    : "/";

  fetch(`${siteRoot}assets/includes/navigation.html`)
    .then(response => {
      if (!response.ok) {
        throw new Error(`Navigation request failed: ${response.status}`);
      }
      return response.text();
    })
    .then(html => {
      const placeholder = document.getElementById("navigation-placeholder");
      placeholder.innerHTML = html;

      placeholder.querySelectorAll("a[data-path]").forEach(link => {
        link.href = `${siteRoot}${link.dataset.path}`;
      });
    })
    .catch(error => console.error("Navigation load failed:", error));

  fetch(`${siteRoot}assets/includes/footer.html`)
    .then(response => {
      if (!response.ok) {
        throw new Error(`Footer request failed: ${response.status}`);
      }
      return response.text();
    })
    .then(html => {
      document.getElementById("footer-placeholder").innerHTML = html;
    })
    .catch(error => console.error("Footer load failed:", error));
</script>

</body>
</html>
