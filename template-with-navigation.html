<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Irina Shablinsky">
  <meta name="description" content="Course page description">
  <title>CS1 – Page Title</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <h1>Page Title</h1>
  </header>

  <div id="navigation-placeholder"></div>

  <main>
    <!-- Page content goes here -->
  </main>

  <div id="footer-placeholder"></div>

  <script>
    fetch("assets/includes/navigation.html")
      .then(response => response.text())
      .then(html => {
        document.getElementById("navigation-placeholder").innerHTML = html;
      })
      .catch(error => console.error("Navigation load failed:", error));

    fetch("assets/includes/footer.html")
      .then(response => response.text())
      .then(html => {
        document.getElementById("footer-placeholder").innerHTML = html;
      })
      .catch(error => console.error("Footer load failed:", error));
  </script>
</body>
</html>
